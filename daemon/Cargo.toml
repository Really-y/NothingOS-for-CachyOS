[package]
name = "nothingd"
version = "0.1.0"
edition = "2021"
description = "Session DBus daemon providing system/weather/network data for the NothingOS Plasma theme"
license = "MIT"

[[bin]]
name = "nothingd"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
