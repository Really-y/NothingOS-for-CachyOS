# Nothing — generated by terminal/gen_terminal.py from palette.json
[window]
opacity = 1.0
dynamic_title = true
decorations = "Full"
startup_mode = "Windowed"

[window.padding]
x = 16
y = 14

[window.dimensions]
columns = 100
lines = 30

[font]
size = 11.0

[font.offset]
x = 0
y = 3

[font.glyph_offset]
x = 0
y = 1

[font.normal]
family = "Space Mono"
style = "Regular"

[font.bold]
family = "Space Mono"
style = "Bold"

[font.italic]
family = "Space Mono"
style = "Italic"

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.cursor]
cursor = "#ffffff"
text = "#000000"

[colors.selection]
background = "#ffffff"
text = "#000000"

[colors.search.matches]
foreground = "#000000"
background = "#8e8e8e"

[colors.search.focused_match]
foreground = "#000000"
background = "#ffffff"

[colors.footer_bar]
foreground = "#ffffff"
background = "#1a1a1a"

[colors.normal]
black = "#1a1a1a"
red = "#d71921"
green = "#9eaea2"
yellow = "#b8b19c"
blue = "#9aa3b2"
magenta = "#aaa1b0"
cyan = "#9aaeae"
white = "#c8c8c8"

[colors.bright]
black = "#5e5e5e"
red = "#d71921"
green = "#c6d2c8"
yellow = "#d9d3c1"
blue = "#c4cad6"
magenta = "#cfc7d5"
cyan = "#c4d3d3"
white = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = { shape = "Block", blinking = "Never" }

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/zsh"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
