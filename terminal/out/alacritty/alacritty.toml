# Nothing — generated by terminal/gen_terminal.py from palette.json
[window]
opacity = 1.0
dynamic_title = true
decorations = "Full"
startup_mode = "Windowed"

[window.padding]
x = 16
y = 14

[window.dimensions]
columns = 100
lines = 30

[font]
size = 11.0

[font.offset]
x = 0
y = 3

[font.glyph_offset]
x = 0
y = 1

[font.normal]
family = "Space Mono"
style = "Regular"

[font.bold]
family = "Space Mono"
style = "Bold"

[font.italic]
family = "Space Mono"
style = "Italic"

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.cursor]
cursor = "#ffffff"
text = "#000000"

[colors.selection]
background = "#ffffff"
text = "#000000"

[colors.search.matches]
foreground = "#000000"
background = "#8e8e8e"

[colors.search.focused_match]
foreground = "#000000"
background = "#ffffff"

[colors.footer_bar]
foreground = "#ffffff"
background = "#1a1a1a"

[colors.normal]
black = "#1a1a1a"
red = "#d71921"
green = "#8fb59a"
yellow = "#c9b98a"
blue = "#8a9bb5"
magenta = "#a994b5"
cyan = "#86aeb0"
white = "#c8c8c8"

[colors.bright]
black = "#5e5e5e"
red = "#ff3b44"
green = "#b4d4bb"
yellow = "#e0d3a8"
blue = "#aebbd1"
magenta = "#c6b6d1"
cyan = "#aacdcf"
white = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = { shape = "Block", blinking = "Never" }

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/zsh"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
