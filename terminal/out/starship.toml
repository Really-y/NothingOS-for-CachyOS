# Nothing — generated by terminal/gen_terminal.py from palette.json
# minimal: white dir, grey branch, a dot that is white on success and red on error.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = """$directory$git_branch$git_status
$character"""
right_format = "$cmd_duration$time"

[character]
success_symbol = "[●](#ffffff)"
error_symbol = "[●](#d71921)"
vimcmd_symbol = "[○](#ffffff)"
vimcmd_replace_symbol = "[○](#d71921)"
vimcmd_visual_symbol = "[○](#8e8e8e)"

[directory]
style = "#ffffff"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " ○"
read_only_style = "#8e8e8e"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "#8e8e8e"
format = "[$symbol$branch]($style) "

[git_status]
style = "#5e5e5e"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "!"
modified = "~"
staged = "+"
untracked = "?"
deleted = "-"
renamed = "»"
stashed = ""
ahead = "↑"
behind = "↓"
diverged = "↕"

[cmd_duration]
min_time = 2000
style = "#5e5e5e"
format = "[$duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "#5e5e5e"
format = "[$time]($style)"
