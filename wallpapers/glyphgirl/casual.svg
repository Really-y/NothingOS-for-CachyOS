<?xml version="1.0" encoding="UTF-8"?>
<!-- "Casual" style (generated by make_casual.py from glam.svg)
      for org.nothing.dots: an original ADULT woman (no existing character, no
     logos), confident and stylish, non-explicit. Same conventions as girl.svg:
     values are LUMINANCE MAPS (grey = dot brightness/size), features 0 = missing dots,
     highlights 1.0 are forced to full-size dots. ~3.2 canvas px per dot on screen.
     Head tilted 5 degrees toward the desktop. Red accent = the earring bead (shader). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="iris" x1="0" y1="-16" x2="0" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.6" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#8c8c8c"/>
    </linearGradient>
    <linearGradient id="shoulders" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bdbdbd"/>
      <stop offset="0.5" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="skinBody" x1="94" y1="0" x2="506" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b0b0b0"/><stop offset="0.45" stop-color="#cfcfcf"/><stop offset="1" stop-color="#8c8c8c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="faceShape" d="M 198,290 C 198,236 242,212 300,212 C 358,212 402,236 402,290
      L 402,352 C 402,402 376,440 336,470 C 322,481 312,488 300,490 C 288,488 278,481 264,470
      C 224,440 198,402 198,352 Z"/>
    <clipPath id="faceClip"><use xlink:href="#faceShape"/></clipPath>
    <clipPath id="neckClip"><path d="M 264,430 L 268,570 L 332,570 L 336,430 Z"/></clipPath>
    <!-- almond eye, viewer-right orientation (outer corner at +x, lifted), centred on 0,0 -->
    <path id="sclera" d="M -34,6 C -24,-14 18,-20 34,-8 C 26,8 10,12 -4,12 C -20,12 -30,10 -34,6 Z"/>
    <clipPath id="scleraClip"><use xlink:href="#sclera"/></clipPath>
    <g id="eyeOpen">
      <use xlink:href="#sclera" fill="#d4d4d4"/>
      <g clip-path="url(#scleraClip)">
        <circle cx="-3" cy="1" r="17" fill="url(#iris)" stroke="#262626" stroke-width="3"/>
        <circle cx="-3" cy="0" r="6" fill="#000000"/>
      </g>
      <!-- heavy upper lid + winged liner (half-lidded, confident) -->
      <path fill="#000000" d="M -37,8 C -27,-18 18,-26 36,-10 L 46,-17 L 41,-4 C 24,-7 -14,-6 -31,8 Z"/>
      <!-- lower lid, outer half -->
      <path d="M 4,12 C 16,11 26,8 33,2" fill="none" stroke="#595959" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="eyeClosed">
      <path d="M -32,4 C -14,14 14,12 34,-4" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
      <path d="M 30,-2 L 42,-9" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path id="brow" d="M 280,302 C 264,294 242,290 224,290 C 218,291 213,293 210,297 C 222,297 242,299 258,302 C 266,304 274,306 280,307 Z"/>
  </defs>

  <g id="hair-back" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <!-- long voluminous waves -->
    <path fill="#474747" d="M 300,80 C 190,82 134,170 130,280 C 126,380 114,460 104,540
      C 96,600 112,650 98,700 C 90,730 100,750 92,770 C 124,752 146,724 156,690 L 444,690
      C 454,724 476,752 508,770 C 500,750 510,730 502,700 C 488,650 504,600 496,540
      C 486,460 474,380 470,280 C 466,170 410,82 300,80 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 150,230 C 128,300 156,380 132,460 C 110,540 138,610 112,690"/>
    <path fill="none" stroke="#666666" stroke-width="8" stroke-linecap="round"
          d="M 456,240 C 464,320 456,400 470,480 C 480,550 476,620 488,690"/>
  </g>

  <g id="neck" transform="translate(84,11.2) scale(0.72)">
    <path fill="#c4c4c4" d="M 264,430 L 268,570 L 332,570 L 336,430 Z"/>
    <path d="M 288,484 C 292,512 300,540 306,560" fill="none" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round"/>
    <path fill="#7a7a7a" filter="url(#soft2)" clip-path="url(#neckClip)"
          d="M 262,452 C 282,486 318,486 338,452 L 338,488 C 318,500 282,500 262,488 Z"/>
    <!-- choker with a small ring -->
    <path fill="#141414" d="M 266,506 C 286,512 314,512 334,506 L 334,520 C 314,526 286,526 266,520 Z"/>
    <circle cx="300" cy="530" r="6" fill="none" stroke="#999999" stroke-width="4"/>
  </g>

  <g id="body">
    <!-- shoulders, arms and midriff (skin), lit from the left -->
    <path fill="url(#skinBody)" d="M 280,404 L 320,404 C 324,428 350,440 400,448
      C 452,456 482,482 490,530 C 498,600 500,700 506,830 L 94,830 C 100,700 102,600 110,530
      C 118,482 148,456 200,448 C 250,440 276,428 280,404 Z"/>
    <path fill="none" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round"
          d="M 288,440 C 264,448 238,452 212,456 M 312,440 C 336,448 362,452 388,456"/>
    <!-- gap between arms and torso -->
    <path fill="none" stroke="#4a4a4a" stroke-width="9" stroke-linecap="round"
          d="M 156,560 C 160,640 162,720 166,830 M 444,560 C 440,640 438,720 434,830"/>
    <!-- crop camisole: thin straps, straight modest neckline, ends above the waist -->
    <path fill="none" stroke="#262626" stroke-width="7" stroke-linecap="round" d="M 232,528 L 222,452 M 368,528 L 378,452"/>
    <path fill="#2a2a2a" d="M 170,540 C 204,522 250,528 300,532 C 350,528 396,522 430,540
      L 434,660 C 380,676 220,676 166,660 Z"/>
    <path fill="none" stroke="#808080" stroke-width="6" stroke-linecap="round"
          d="M 172,540 C 204,524 250,530 300,534 C 350,530 396,524 428,540"/>
    <path fill="none" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round" d="M 168,656 C 220,672 380,672 432,656"/>
    <!-- midriff: soft centre shade, navel -->
    <ellipse cx="300" cy="712" rx="3.5" ry="5" fill="#6a6a6a"/>
    <!-- denim shorts waistband at the bottom edge -->
    <path fill="#3a3a3a" d="M 160,748 C 220,758 380,758 440,748 L 446,830 L 154,830 Z"/>
    <path fill="none" stroke="#666666" stroke-width="6" stroke-linecap="round" d="M 162,752 C 220,762 380,762 438,752"/>
    <circle cx="300" cy="772" r="5" fill="#999999"/>
  </g>

  <g id="hair-curtain" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <!-- the viewer-left side falls in front of the shoulder in loose waves -->
    <path fill="#4a4a4a" d="M 168,240 C 152,320 158,410 176,486 C 190,540 182,590 160,640
      C 148,668 150,696 140,722 C 172,706 192,680 198,650 C 204,690 196,720 186,748
      C 220,720 232,680 228,636 C 224,580 216,520 214,460 C 210,380 208,310 214,250 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 166,280 C 160,350 166,420 182,486 C 194,536 186,590 166,640"/>
    <path fill="#4a4a4a" d="M 418,330 C 440,400 428,470 452,540 C 466,590 456,640 470,690
      C 480,660 482,616 488,570 C 480,500 466,420 436,330 Z"/>
    <path fill="none" stroke="#808080" stroke-width="7" stroke-linecap="round" d="M 428,350 C 444,420 436,480 458,546"/>
    <path fill="none" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round"
          d="M 196,330 C 192,400 196,470 206,530 C 212,580 206,630 196,680"/>
  </g>

  <g id="face" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <!-- ear (viewer-right): hair tucked behind it, earring below -->
    <path fill="#bdbdbd" d="M 398,320 C 414,312 430,324 430,346 C 430,368 420,388 404,394 C 400,380 400,340 398,320 Z"/>
    <path fill="none" stroke="#6a6a6a" stroke-width="5" stroke-linecap="round" d="M 408,332 C 420,336 422,356 414,374"/>
    <use xlink:href="#faceShape" fill="#d4d4d4"/>
    <!-- cheekbone shade + soft shadow under the hair -->
    <g clip-path="url(#faceClip)">
      <path fill="#b8b8b8" filter="url(#soft)" d="M 196,380 C 212,410 236,430 250,446 L 196,450 Z"/>
      <path fill="#b8b8b8" filter="url(#soft)" d="M 404,380 C 388,410 364,430 350,446 L 404,450 Z"/>
      <path fill="#a6a6a6" filter="url(#soft)" d="M 196,214 L 290,214 L 290,240 C 262,256 236,290 220,350 L 196,350 Z"/>
    </g>
    <use xlink:href="#brow" fill="#141414"/>
    <use xlink:href="#brow" fill="#141414" transform="translate(600,0) scale(-1,1)"/>
    <!-- nose: side shadow + tip -->
    <path d="M 310,372 C 312,388 312,400 306,410" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
    <path d="M 296,414 L 304,414" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
    <!-- lips: asymmetric smirk (earring-side corner raised), M-shaped bow -->
    <path fill="#595959" d="M 276,446 C 284,442 292,437 297,440 L 300,443 L 303,439
      C 310,435 320,435 330,434 C 318,446 292,450 276,446 Z"/>
    <path fill="#a6a6a6" d="M 282,449 C 292,462 316,460 324,442 C 312,452 292,452 282,449 Z"/>
    <path d="M 276,446 Q 300,451 330,434" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="306" cy="454" rx="5" ry="2.5" fill="#ffffff"/>
    <path d="M 333,430 L 336,438" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <g id="eyes-open" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <use xlink:href="#eyeOpen" transform="translate(356,338) scale(1.25)"/>
    <use xlink:href="#eyeOpen" transform="translate(244,338) scale(-1.25,1.25)"/>
    <circle cx="242" cy="336" r="5.5" fill="#ffffff"/>
    <circle cx="347" cy="336" r="5.5" fill="#ffffff"/>
  </g>

  <g id="eyes-closed" display="none" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <use xlink:href="#eyeClosed" transform="translate(356,340) scale(1.2)"/>
    <use xlink:href="#eyeClosed" transform="translate(244,340) scale(-1.2,1.2)"/>
  </g>

  <g id="hair-side" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <!-- earring side: sleek, swept back from the part and tucked behind the ear -->
    <path fill="#474747" d="M 272,96 C 340,88 410,120 430,200 C 440,250 434,296 414,326
      C 406,300 400,272 392,252 C 372,222 330,204 294,200 C 284,200 278,204 272,210 Z"/>
    <path fill="none" stroke="#808080" stroke-width="9" stroke-linecap="round" d="M 292,106 C 342,102 394,132 416,192"/>
    <path fill="none" stroke="#737373" stroke-width="8" stroke-linecap="round" d="M 302,150 C 350,150 392,180 410,240"/>
  </g>

  <g id="bangs" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <!-- big fringe from the part sweeping down across the far brow and that eye's outer corner -->
    <path fill="#474747" d="M 272,94 C 228,98 184,128 166,190 C 154,234 158,284 174,332
      C 184,352 196,360 208,354 C 212,332 216,306 228,286 C 242,264 258,248 274,236
      C 268,190 268,140 272,94 Z"/>
    <path fill="none" stroke="#808080" stroke-width="9" stroke-linecap="round" d="M 262,110 C 228,150 196,204 190,284"/>
    <path fill="none" stroke="#808080" stroke-width="8" stroke-linecap="round" d="M 256,160 C 230,198 212,256 206,330"/>
    <path fill="none" stroke="#262626" stroke-width="8" stroke-linecap="round" d="M 266,140 C 240,176 222,226 220,290"/>
  </g>

  <g id="clip" transform="translate(84,11.2) scale(0.72) rotate(-5 300 480)">
    <!-- earring hook; the red bead under it is drawn by the shader (clipUV) -->
    <path d="M 406,392 L 406,406" stroke="#a6a6a6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
