<?xml version="1.0" encoding="UTF-8"?>
<!-- "Sultry" style for org.nothing.dots (generated by make_sultry.py from sultry-body.svgfrag):
     an original ADULT woman, three-quarter back view in a backless gown, glancing back over her
     shoulder. Non-explicit. Values are LUMINANCE MAPS (grey = dot size/brightness); in the face
     dark features become missing dots; 1.0 highlights are forced to full-size dots. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g transform="translate(43,64) scale(0.83)">
  <!-- ===== Sultry: three-quarter BACK view (make_sultry.py wraps this into sultry.svg) =====
       Body in canvas coordinates; head groups in the local head frame (translate(294,282) rotate(-8) scale(1.35)): origin = head
       centre, three-quarter profile facing viewer-left, chin at (-46,66), ear at (48,4).
       Light from the left (the desktop): rim group. Values: face 0.85 (brightest skin, cheek
       0.9), back 0.78 -> 0.42 into the shadow side and toward the small of the back,
       hair 0.28 / strands 0.5-0.55, gown 0.27 with 0.55 satin folds, rim 0.88. -->
  <defs>
    <linearGradient id="skinBack" x1="160" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#909090"/><stop offset="0.5" stop-color="#808080"/><stop offset="1" stop-color="#585858"/>
    </linearGradient>
    <linearGradient id="backFall" x1="0" y1="450" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="skinArm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c9c9c"/><stop offset="1" stop-color="#787878"/>
    </linearGradient>
    <linearGradient id="skinArmR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e8e8e"/><stop offset="1" stop-color="#5c5c5c"/>
    </linearGradient>
    <path id="backShape" d="M 296,372 C 250,378 182,392 152,410 C 140,420 140,440 156,452
      C 166,460 170,466 172,472 C 190,520 210,560 218,600 L 218,660 L 410,660 L 408,600
      C 418,540 430,480 440,440 C 432,420 424,400 410,386 C 404,380 398,376 392,374 Z"/>
    <clipPath id="backClip"><use xlink:href="#backShape"/></clipPath>
    <path id="faceShape" d="M -46,-74 C -56,-58 -62,-42 -61,-26 C -60,-18 -57,-12 -58,-6
      C -62,2 -68,12 -70,18 C -71,22 -67,25 -62,25 C -61,29 -61,32 -59,34 C -60,39 -59,43 -57,46
      C -55,52 -51,56 -45,57 C -28,57 -2,50 20,40 C 34,32 42,20 44,4 L 44,-74 Z"/>
    <clipPath id="faceClip"><use xlink:href="#faceShape"/></clipPath>
  </defs>

  <g id="hair-back">
    <!-- skull hair, kept close to the head (sleek, swept up) -->
    <g transform="translate(294,282) rotate(-8) scale(1.35)">
      <path fill="#474747" d="M -50,-74 C -40,-100 -6,-112 24,-106 C 56,-100 78,-76 80,-44
        C 82,-20 74,2 62,14 L 44,14 L 44,-74 Z"/>
      <path fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linecap="round" d="M -20,-100 C 10,-108 50,-96 68,-64"/>
      <path fill="none" stroke="#5e5e5e" stroke-width="3" stroke-linecap="round" d="M -34,-96 C -46,-104 -58,-102 -66,-92 M 10,-108 C 22,-120 38,-120 48,-112 M 74,-58 C 86,-52 92,-40 90,-28"/>
      <path fill="none" stroke="#7a7a7a" stroke-width="3.5" stroke-linecap="round" d="M 30,-88 C 54,-78 68,-54 70,-28"/>
      <path fill="none" stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round" d="M 48,-90 C 66,-74 76,-50 74,-20"/>
    </g>
    <!-- twist gathered up the back of the head into her hand; the ends spill over it, lit -->
    <path fill="#474747" d="M 366,300 C 380,262 388,224 392,186 L 420,192 C 414,232 400,272 384,306 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round" d="M 376,292 C 388,258 396,222 402,190"/>
    <path fill="#474747" d="M 386,170 C 384,138 402,114 430,110 C 452,108 468,122 470,146
      C 460,134 446,130 434,136 C 422,142 418,156 420,174 Z"/>
    <path fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round" d="M 398,160 C 398,136 414,120 438,118"/>
    <path fill="none" stroke="#7a7a7a" stroke-width="4" stroke-linecap="round" d="M 446,124 C 458,128 464,136 466,144"/>
  </g>

  <g id="neck">
    <!-- side neck twisting into the turn, nape lit under the updo, tendon ear -> collarbone -->
    <path fill="#b4b4b4" d="M 286,380 C 296,360 308,346 322,336 C 334,326 346,312 356,298
      C 362,292 368,288 374,286 C 378,320 382,350 390,380 Z"/>
    <path fill="none" stroke="#6e6e6e" stroke-width="5" stroke-linecap="round" d="M 352,306 C 336,330 318,352 300,376"/>
    <path fill="none" stroke="#d4d4d4" stroke-width="5" stroke-linecap="round" d="M 378,294 C 381,322 385,350 389,374"/>
  </g>

  <g id="body" transform="translate(325,0) scale(0.85,1) translate(-325,0)">
    <!-- (the torso group is narrowed 15 percent about the spine, x = 325) -->
    <!-- skin: shoulders are the widest part; below them only a tall, narrow bare column -->
    <use xlink:href="#backShape" fill="url(#skinBack)"/>
    <g clip-path="url(#backClip)">
      <!-- light catch: an angled plane on the near shoulder blade; the far half turns into shadow -->
      <path fill="#a6a6a6" filter="url(#soft2)" d="M 178,414 L 250,394 L 264,420 L 192,438 Z"/>
      <rect x="330" y="380" width="120" height="240" fill="#4a4a4a" opacity="0.55" filter="url(#soft2)"/>
      <!-- spine: the strongest back cue, a ~2-dot dark groove from the nape to the scoop -->
      <path fill="none" stroke="#3a3a3a" stroke-width="12" stroke-linecap="round" d="M 340,388 C 330,430 326,470 324,510 C 322,545 320,570 318,592"/>
    </g>
    <!-- near arm (her left): deltoid, slim upper arm, elbow crease, forearm; hand tucked behind the hip -->
    <path fill="url(#skinArm)" d="M 138,418 C 120,430 112,452 114,480 C 114,530 112,580 112,612
      C 118,656 150,694 186,716 C 194,720 204,722 210,718 C 212,708 208,700 202,694
      C 176,680 158,654 150,616
      C 150,566 152,512 154,480 C 156,462 158,446 156,436 C 152,428 146,422 138,418 Z"/>
    <path fill="none" stroke="#5a5a5a" stroke-width="3.5" stroke-linecap="round" d="M 122,612 C 128,618 136,620 144,618"/>
    <!-- raised far arm (her right): deltoid, upper arm, rounded elbow, forearm tapering to the wrist -->
    <path fill="url(#skinArmR)" d="M 392,378 C 420,330 458,252 484,192 C 490,176 498,158 512,152
      C 528,148 538,162 534,180 C 524,216 506,272 490,320 C 484,340 474,352 470,368
      C 462,396 456,420 448,446 C 440,428 428,408 414,394 C 406,386 398,380 392,378 Z"/>
    <path fill="#9a9a9a" d="M 508,146 C 482,150 454,160 430,167 L 430,181 C 454,182 482,186 514,184
      C 536,176 534,146 508,146 Z"/>
    <path fill="none" stroke="#404040" stroke-width="4" stroke-linecap="round" d="M 470,372 C 482,336 494,300 506,266"/>
    <!-- gown: back panels wrap the sides and rise to just under the shoulders; the opening is a
         tall narrow keyhole down to a tight U at the waist -->
    <path fill="#404040" d="M 160,446 L 268,446 C 272,490 280,540 296,572 C 304,586 312,592 318,594 C 326,592 334,586 340,572 C 352,540 360,490 366,440 L 438,432
      C 430,500 416,560 406,596 C 424,646 452,700 458,760 L 462,880 L 180,880 L 186,800
      C 188,740 204,668 220,598 C 210,560 190,520 172,474 C 166,462 162,452 160,446 Z"/>
    <g fill="none" stroke-linecap="round">
      <path stroke="#262626" stroke-width="10" d="M 276,600 C 276,670 270,740 266,820 M 356,600 C 364,670 370,740 374,820"/>
      <path stroke="#8c8c8c" stroke-width="9" filter="url(#soft2)" d="M 236,610 C 228,680 216,740 208,820"/>
      <path stroke="#8c8c8c" stroke-width="8" filter="url(#soft2)" d="M 318,620 C 320,680 322,740 322,820"/>
      <path stroke="#7a7a7a" stroke-width="8" filter="url(#soft2)" d="M 392,600 C 402,670 412,740 420,820"/>
      <!-- centre seam where the scoop meets the spine -->
      <path stroke="#101010" stroke-width="3.5" d="M 318,598 L 318,640"/>
    </g>
    <!-- bright continuous binding: panel tops and the whole opening -->
    <path fill="none" stroke="#e2e2e2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M 160,446 L 268,446 C 272,490 280,540 296,572 C 304,586 312,592 318,594 C 326,592 334,586 340,572 C 352,540 360,490 366,440 L 438,432"/>
    <!-- halter straps in a V from the opening up to the nape: black satin with bright piping -->
    <path fill="none" stroke="#141414" stroke-width="10" stroke-linecap="round" d="M 270,444 C 290,422 312,402 336,388"/>
    <path fill="none" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round" d="M 264,438 C 284,416 306,396 330,382"/>
    <path fill="none" stroke="#141414" stroke-width="10" stroke-linecap="round" d="M 366,440 C 360,420 354,402 346,388"/>
    <path fill="none" stroke="#d6d6d6" stroke-width="4" stroke-linecap="round" d="M 374,436 C 368,416 362,398 354,384"/>
  </g>

  <g id="rim" transform="translate(325,0) scale(0.85,1) translate(-325,0)">
    <!-- light from the left (the lit side only): near shoulder, arm, waist -> hip, raised arm -->
    <path fill="none" stroke="#a4a4a4" stroke-width="10" stroke-linecap="round" filter="url(#soft2)"
          d="M 124,470 C 118,540 118,600 120,660"/>
    <g fill="none" stroke="#e0e0e0" stroke-width="5" stroke-linecap="round">
      <path d="M 286,375 C 248,380 184,394 154,412 C 136,424 118,440 117,476 C 116,520 115,570 115,612
        C 122,654 152,692 188,716"/>
      <path d="M 174,476 C 192,522 210,560 218,600 C 210,650 198,720 190,800 L 186,880"/>
      <path d="M 396,376 C 424,326 460,250 486,192 C 492,176 500,158 514,152 M 508,149 C 482,153 454,162 432,168"/>
    </g>
  </g>

  <g id="hair-curtain" transform="translate(325,0) scale(0.85,1) translate(-325,0)">
    <!-- a lock falls from her hand over the far shoulder and hangs beside the waist -->
    <path fill="#474747" stroke="#0c0c0c" stroke-width="8" paint-order="stroke" d="M 418,194 C 408,236 410,272 422,304 C 432,334 420,370 426,410
      C 432,448 450,474 444,512 C 440,536 446,556 458,574 C 468,552 476,532 474,504
      C 470,470 458,440 464,404 C 470,368 470,330 458,296 C 448,266 446,230 446,196 Z"/>
    <path fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"
          d="M 428,206 C 420,240 422,272 432,300 C 442,332 430,368 436,406 C 440,442 456,470 452,508"/>
    <path fill="none" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round"
          d="M 440,210 C 436,246 440,276 448,304 C 456,338 446,372 450,410"/>
    <!-- 1-dot rim where the hair crosses the background -->
    <path fill="none" stroke="#9a9a9a" stroke-width="3.5" stroke-linecap="round"
          d="M 462,420 C 460,456 474,482 472,508 C 470,530 466,548 458,570"/>
    <!-- two loose tendrils at the nape (sway) -->
    <path fill="none" stroke="#666666" stroke-width="4" stroke-linecap="round" d="M 376,300 C 370,320 382,338 374,360 C 372,370 376,380 380,388"/>
    <path fill="none" stroke="#5a5a5a" stroke-width="3.5" stroke-linecap="round" d="M 386,302 C 386,322 394,338 390,356"/>
  </g>

  <g id="hand" transform="translate(325,0) scale(0.85,1) translate(-325,0)">
    <!-- back of her right hand from a slim wrist; four long slim fingers curling up-left into the
         hair (dark gaps between them), thumb wrapped under the ponytail, lit knuckle edge -->
    <g fill="none" stroke-linecap="round" stroke="#0e0e0e" stroke-width="11">
      <path d="M 404,158 C 392,150 380,142 370,134 C 366,131 361,131 358,135"/>
      <path d="M 402,166 C 388,162 374,156 360,152 C 355,151 350,153 350,158"/>
      <path d="M 402,174 C 388,174 374,172 362,172 C 357,172 353,175 354,180"/>
      <path d="M 404,182 C 394,186 384,188 374,190"/>
      <path d="M 424,180 C 418,190 408,196 398,198"/>
    </g>
    <path fill="#c2c2c2" d="M 432,166 C 424,158 414,154 404,156 C 398,164 398,176 402,186 C 412,186 422,184 432,180 Z"/>
    <g fill="none" stroke-linecap="round" stroke="#c2c2c2" stroke-width="5.5">
      <path d="M 404,158 C 392,150 380,142 370,134 C 366,131 361,131 358,135"/>
      <path d="M 402,166 C 388,162 374,156 360,152 C 355,151 350,153 350,158"/>
      <path d="M 402,174 C 388,174 374,172 362,172 C 357,172 353,175 354,180"/>
      <path d="M 404,182 C 394,186 384,188 374,190"/>
      <path d="M 424,180 C 418,190 408,196 398,198"/>
    </g>
    <path fill="none" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round" d="M 372,132 C 386,142 404,152 432,164"/>
  </g>

  <g id="face" transform="translate(294,282) rotate(-8) scale(1.35)">
    <use xlink:href="#faceShape" fill="#d9d9d9"/>
    <path fill="none" stroke="#5a5a5a" stroke-width="2.2" stroke-linecap="round" d="M -57,46 C -55,52 -51,56 -45,57 C -28,57 -2,50 20,40"/>
    <!-- ear with the lobe free for the earring -->
    <path fill="#bababa" d="M 42,-12 C 50,-18 58,-8 57,4 C 56,16 50,24 43,25 C 41,12 41,0 42,-12 Z"/>
    <path fill="none" stroke="#6a6a6a" stroke-width="2.4" stroke-linecap="round" d="M 46,-6 C 52,-2 52,10 47,16"/>
    <!-- brow (the far one is hidden by the turn) -->
    <path fill="none" stroke="#141414" stroke-width="3.4" stroke-linecap="round" d="M -38,-23 C -28,-29 -14,-31 0,-27"/>
    <!-- nose: bridge shade, nostril under the tip (the tip itself breaks the contour) -->
    <path fill="none" stroke="#b0b0b0" stroke-width="2.6" stroke-linecap="round" d="M -54,-2 C -56,5 -60,11 -64,17"/>
    <path fill="none" stroke="#7a7a7a" stroke-width="2.6" stroke-linecap="round" d="M -63,24.5 L -57,25.5"/>
<g transform="translate(1,-6)">
    <!-- lips: fuller upper lip, short dark parting, glossy lower lip -->
    <path fill="#4a4a4a" d="M -61,41 C -57,36 -52,35 -48,37 C -45,35 -40,34 -34,37 L -35,41 L -60,42.5 Z"/>
    <path fill="#000000" d="M -60,42.5 C -52,44.5 -44,44 -35,40.5 C -44,45.5 -52,46 -60,42.5 Z"/>
    <path fill="#8a8a8a" d="M -58,45 C -54,52 -42,53 -37,44 C -44,47 -52,47 -58,45 Z"/>
    <ellipse cx="-48" cy="48.5" rx="2.8" ry="1.6" fill="#b8b8b8"/>
    </g>
  </g>

  <g id="eyes-open" transform="translate(294,282) rotate(-8) scale(1.35)">
    <!-- near eye: half-lidded almond, iris in the corner nearest the viewer (viewer-right) -->
    <clipPath id="nearEye"><path d="M -36,-6 C -28,-16 -10,-18 -2,-10 C -8,-2 -20,0 -28,-1 C -32,-2 -35,-4 -36,-6 Z"/></clipPath>
    <path fill="#d4d4d4" d="M -36,-6 C -28,-16 -10,-18 -2,-10 C -8,-2 -20,0 -28,-1 C -32,-2 -35,-4 -36,-6 Z"/>
    <g clip-path="url(#nearEye)">
      <circle cx="-9" cy="-7" r="7" fill="#6a6a6a"/>
      <circle cx="-9" cy="-7" r="3" fill="#000000"/>
    </g>
    <path fill="#000000" d="M -38,-5 C -30,-20 -10,-22 0,-12 L 7,-17 L 3,-7 C -6,-11 -26,-10 -35,-3 Z"/>
    <path fill="none" stroke="#595959" stroke-width="2.2" stroke-linecap="round" d="M -15,-1 C -9,-2 -5,-4 -2,-7"/>
    <circle cx="-10" cy="-7" r="2.2" fill="#ffffff"/>
    <path fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" d="M -4,-15 L 0,-20 M -10,-17 L -8,-22 M -16,-18 L -15,-23"/>
  </g>

  <g id="eyes-closed" display="none" transform="translate(294,282) rotate(-8) scale(1.35)">
    <path fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round" d="M -36,-5 C -26,0 -10,0 -1,-8"/>
    <path fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" d="M -1,-8 L 5,-13"/>
  </g>

  <g id="hair-side" transform="translate(294,282) rotate(-8) scale(1.35)">
    <!-- temple hair: hairline in front of the ear, swept back over its top -->
    <path fill="#474747" d="M -14,-82 C 12,-74 26,-56 24,-36 C 22,-24 26,-14 36,-12
      C 42,-16 50,-16 58,-12 C 62,-24 60,-50 50,-66 C 36,-80 16,-86 -14,-82 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="3.5" stroke-linecap="round" d="M 10,-70 C 30,-64 46,-50 54,-30"/>
    <!-- dark lock behind the ear: the earring hangs against it, clear of the jaw -->
    <path fill="#474747" d="M 50,6 C 42,22 37,40 39,58 C 40,66 45,72 50,77 C 56,60 59,40 59,22 C 59,14 56,8 50,6 Z"/>
    <path fill="none" stroke="#7a7a7a" stroke-width="2.4" stroke-linecap="round" d="M 54,14 C 52,30 52,48 53,66"/>
  </g>

  <g id="bangs" transform="translate(294,282) rotate(-8) scale(1.35)">
    <!-- short side-swept fringe at the hairline, off the near eye -->
    <path fill="#474747" d="M -6,-100 C -40,-98 -62,-80 -66,-56 C -68,-44 -66,-34 -62,-28
      C -56,-40 -46,-52 -30,-60 C -18,-66 -6,-72 4,-76 Z"/>
    <path fill="none" stroke="#9a9a9a" stroke-width="3.5" stroke-linecap="round" d="M -10,-92 C -36,-88 -54,-72 -60,-48"/>
    <path fill="none" stroke="#474747" stroke-width="5" stroke-linecap="round" d="M -22,-78 C -40,-60 -48,-42 -47,-24"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="2.2" stroke-linecap="round" d="M -26,-74 C -40,-58 -46,-44 -46,-30"/>
  </g>

  <g id="clip" transform="translate(294,282) rotate(-8) scale(1.35)">
    <!-- earring chain from the lobe; the red bead under it is drawn by the shader (clipUV) -->
    <circle cx="43" cy="24" r="2.2" fill="#e0e0e0"/>
    <path d="M 43,26 L 48,32" stroke="#b0b0b0" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  </g>
</svg>
