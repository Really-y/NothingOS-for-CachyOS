<?xml version="1.0" encoding="UTF-8"?>
<!-- Original character for org.nothing.dots (no existing character, no logos).
     Values are LUMINANCE MAPS, not colours: grey level = brightness (and size) of the dot
     that ends up on screen. Rules: no feature stroke < 10 px (~2 dots), highlights >= 22 px.
     Skin 0.80-0.88, features 0, hair 0.20-0.24, lit rim 0.55.
     Light from the viewer's left. Groups are baked separately by gen_figure.py. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="skin" x1="184" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0e0e0"/>
      <stop offset="1" stop-color="#cbcbcb"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="-30" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.7" stop-color="#737373"/>
      <stop offset="1" stop-color="#737373"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#474747"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <!-- eye white of the viewer-right eye, outer corner at +x, centred on 0,0 -->
    <path id="scleraShape" d="M -38,8 C -37,-24 28,-36 40,-6 C 39,14 30,28 2,30 C -24,30 -37,23 -38,8 Z"/>
    <clipPath id="scleraClip"><use xlink:href="#scleraShape"/></clipPath>
    <g id="eyeOpen">
      <use xlink:href="#scleraShape" fill="#e8e8e8"/>
      <g clip-path="url(#scleraClip)">
        <ellipse cx="-4" cy="4" rx="27" ry="34" fill="url(#iris)"/>
        <!-- light bottom crescent -->
        <path d="M -27,14 C -20,34 12,34 19,14 C 12,26 -20,26 -27,14 Z" fill="#bfbfbf"/>
        <ellipse cx="-4" cy="4" rx="27" ry="34" fill="none" stroke="#0a0a0a" stroke-width="8"/>
        <ellipse cx="-4" cy="2" rx="9" ry="14" fill="#000000"/>
      </g>
      <!-- upper lid: tapered black arc, dips at the outer corner, one two-point flick -->
      <path fill="#000000" d="M -43,12 C -42,-30 30,-44 44,-10 L 53,-17 L 47,-4 L 55,-1 L 45,4
        C 43,9 40,11 37,11 C 35,-12 2,-29 -36,-6 C -39,0 -41,6 -43,12 Z"/>
      <!-- lower lash, outer 40% only -->
      <path d="M 14,31 C 26,29 34,23 39,14" fill="none" stroke="#4d4d4d" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="eyeClosed">
      <path d="M -28,0 C -14,15 14,15 28,0" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round"/>
      <path d="M 25,2 L 37,-6" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    </g>
    <clipPath id="neckClip"><path d="M 265,440 L 265,560 C 282,574 318,574 335,560 L 335,440 Z"/></clipPath>
    <path id="brow" d="M 264,284 C 246,276 218,280 200,295 C 220,290 246,292 262,295 Z"/>
    <!-- face-framing sidelock (viewer-left), mirrored for the right -->
    <path id="sidelock" d="M 162,236 C 150,300 152,392 178,484 C 184,452 194,410 196,362
      C 198,320 204,286 214,256 Z"/>
    <path id="sidelockRim" d="M 160,250 C 152,310 156,390 176,474"/>
  </defs>

  <g id="hair-back">
    <path fill="#363636" d="M 300,84 C 192,84 146,160 140,260 C 136,360 134,460 126,560
      C 120,610 108,650 96,690 C 112,686 122,680 128,672 C 132,690 132,704 128,720
      C 148,706 158,690 164,670 L 172,710 C 184,690 190,666 192,640 L 408,640
      C 410,666 416,690 428,710 L 436,670 C 442,690 452,706 472,720 C 468,704 468,690 472,672
      C 478,680 488,686 504,690 C 492,650 480,610 474,560 C 466,460 464,360 460,260
      C 454,160 408,84 300,84 Z"/>
  </g>

  <g id="body">
    <path fill="url(#hoodie)" d="M 30,800 C 40,690 110,622 212,592 C 242,582 258,562 265,540
      L 335,540 C 342,562 358,582 388,592 C 490,622 560,690 570,800 Z"/>
    <path fill="none" stroke="#737373" stroke-width="10" stroke-linecap="round"
          d="M 36,786 C 48,690 114,626 210,596"/>
    <path fill="none" stroke="#474747" stroke-width="8" stroke-linecap="round"
          d="M 390,596 C 486,626 552,690 564,786"/>
    <path fill="none" stroke="#1e1e1e" stroke-width="10" stroke-linecap="round" d="M 300,640 L 300,800"/>
    <!-- hood roll around the neck -->
    <path fill="#474747" d="M 198,600 C 210,548 254,518 300,528 C 346,518 390,548 402,600
      C 372,628 334,610 300,622 C 266,610 228,628 198,604 Z"/>
    <path fill="none" stroke="#737373" stroke-width="10" stroke-linecap="round"
          d="M 204,594 C 216,554 254,526 296,532"/>
    <!-- drawstrings + aglets -->
    <path fill="none" stroke="#737373" stroke-width="10" stroke-linecap="round"
          d="M 280,620 C 278,652 274,684 272,714 M 320,620 C 324,652 328,686 330,718"/>
    <rect x="265" y="712" width="14" height="22" rx="5" fill="#808080"/>
    <rect x="323" y="716" width="14" height="22" rx="5" fill="#808080"/>
  </g>

  <g id="neck">
    <path fill="#9e9e9e" d="M 265,440 L 265,560 C 282,574 318,574 335,560 L 335,440 Z"/>
    <path fill="#6e6e6e" filter="url(#soft)" clip-path="url(#neckClip)" d="M 262,462 C 280,486 320,486 338,462 L 338,486 C 320,500 280,500 262,486 Z"/>
  </g>

  <g id="hair-curtain">
    <!-- long hair falling over the shoulders, behind the face; tips flip outward -->
    <path fill="#383838" d="M 156,260 C 150,360 150,460 148,540 C 146,600 132,650 112,696
      C 128,692 140,684 148,672 C 150,690 148,708 142,724 C 160,710 170,692 176,672
      C 180,692 182,708 180,724 C 196,700 204,674 206,640 C 208,590 210,540 212,470
      C 214,400 214,330 210,262 Z"/>
    <path fill="#383838" d="M 444,260 C 450,360 450,460 452,540 C 454,600 468,650 488,696
      C 472,692 460,684 452,672 C 450,690 452,708 458,724 C 440,710 430,692 424,672
      C 420,692 418,708 420,724 C 404,700 396,674 394,640 C 392,590 390,540 388,470
      C 386,400 386,330 390,262 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 154,300 C 150,400 150,500 146,566 C 142,616 130,656 116,690"/>
    <path fill="none" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"
          d="M 182,330 C 182,430 182,530 180,620 M 418,330 C 418,430 418,530 420,620"/>
  </g>

  <g id="face">
    <path fill="url(#skin)" d="M 184,300 C 184,250 230,222 300,222 C 370,222 416,250 416,300
      L 416,356 C 416,408 382,444 334,466 C 322,472 312,478 300,478 C 288,478 278,472 266,466
      C 218,444 184,408 184,356 Z"/>
    <!-- soft shadow under the bangs -->
    <path fill="#b3b3b3" filter="url(#soft)" d="M 184,262 L 416,262 L 416,312 C 380,300 340,318 300,310
      C 260,318 220,300 184,312 Z"/>
    <use xlink:href="#brow" fill="#383838"/>
    <use xlink:href="#brow" fill="#383838" transform="translate(600,0) scale(-1,1)"/>
    <!-- blush: short diagonal runs of brighter dots -->
    <path fill="none" stroke="#f2f2f2" stroke-width="7" stroke-linecap="round"
          d="M 206,392 L 214,382 M 222,394 L 230,384 M 238,396 L 246,386
             M 354,396 L 362,386 M 370,394 L 378,384 M 386,392 L 394,382"/>
    <!-- nose + mouth -->
    <path fill="#8c8c8c" d="M 298,399 L 310,399 L 304,406 Z"/>
    <path fill="#1f1f1f" d="M 288,441 Q 300,446 312,441 Q 310,453 300,453 Q 290,453 288,441 Z"/>
  </g>

  <g id="eyes-open">
    <use xlink:href="#eyeOpen" transform="translate(368,338)"/>
    <use xlink:href="#eyeOpen" transform="translate(232,338) scale(-1,1)"/>
    <!-- highlights: same light direction (upper-left) for both eyes -->
    <ellipse cx="226" cy="330" rx="11" ry="13" fill="#ffffff"/>
    <ellipse cx="354" cy="330" rx="11" ry="13" fill="#ffffff"/>
    <circle cx="249" cy="355" r="6" fill="#d9d9d9"/>
    <circle cx="376" cy="355" r="6" fill="#d9d9d9"/>
  </g>

  <g id="eyes-closed" display="none">
    <use xlink:href="#eyeClosed" transform="translate(368,344)"/>
    <use xlink:href="#eyeClosed" transform="translate(232,344) scale(-1,1)"/>
  </g>

  <g id="hair-side">
    <use xlink:href="#sidelock" fill="#3a3a3a"/>
    <use xlink:href="#sidelock" fill="#363636" transform="translate(600,0) scale(-1,1)"/>
    <use xlink:href="#sidelockRim" fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"/>
    <use xlink:href="#sidelockRim" fill="none" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"
         transform="translate(600,0) scale(-1,1)"/>
  </g>

  <g id="bangs">
    <!-- crown + 7 tapered clumps; centre longest, tips curve toward the centre -->
    <path fill="#3a3a3a" d="M 166,282 C 156,160 220,84 300,84 C 380,84 444,160 434,282
      C 428,286 420,292 414,300 C 414,290 410,286 402,282
      C 398,292 388,302 376,308 C 378,298 374,290 366,282
      C 360,296 350,308 338,316 C 342,304 338,292 330,282
      C 326,300 314,314 300,322 C 300,306 296,292 284,282
      C 280,296 270,308 260,314 C 260,302 256,290 248,282
      C 242,294 232,302 222,306 C 222,296 218,288 210,282
      C 204,290 194,296 186,300 C 182,292 176,286 166,282 Z"/>
    <!-- interior strand lines -->
    <path fill="none" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"
          d="M 286,118 C 282,180 290,240 300,300 M 236,140 C 228,190 232,240 240,282
             M 346,128 C 360,180 362,232 356,280 M 196,190 C 188,226 190,256 196,282"/>
    <!-- glossy band: filled tapered shards, jagged lower edge following the skull -->
    <path fill="#737373" d="M 200,176 C 236,140 270,130 300,130 C 334,130 368,142 400,176
      L 392,186 L 380,176 L 372,196 L 356,180 L 344,200 L 330,184 L 318,204 L 304,186
      L 290,204 L 278,186 L 264,200 L 252,182 L 238,198 L 228,180 L 214,194 Z"/>
    <path fill="#999999" d="M 214,170 C 236,150 256,142 276,138 L 270,150 L 262,160 L 254,152
      L 244,170 L 236,158 L 226,176 Z"/>
    <!-- lit rim (left) and a softer right rim -->
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 168,270 C 162,170 220,92 296,88"/>
    <path fill="none" stroke="#4d4d4d" stroke-width="8" stroke-linecap="round"
          d="M 432,270 C 438,170 380,92 304,88"/>
  </g>

  <g id="ahoge">
    <path fill="#3a3a3a" d="M 300,92 C 304,66 322,46 342,50 C 356,54 350,74 330,74
      C 342,66 340,58 332,60 C 318,62 310,76 312,92 Z"/>
    <path fill="none" stroke="#808080" stroke-width="8" stroke-linecap="round"
          d="M 304,84 C 308,66 322,54 338,54"/>
  </g>

  <g id="clip">
    <!-- hair clip bar; the red bead at its end is drawn by the shader (clipUV) -->
    <path d="M 194,236 L 238,214" stroke="#a6a6a6" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
