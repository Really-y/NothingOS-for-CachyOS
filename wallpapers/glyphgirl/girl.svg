<?xml version="1.0" encoding="UTF-8"?>
<!-- Original character for org.nothing.dots (no existing character, no logos).
     Values are LUMINANCE MAPS, not colours: grey level = brightness (and size) of the dot
     that ends up on screen. On screen one dot is ~3.2 canvas px (5 px pitch, 1.15 x height).
     Skin 0.92, cheek shade 0.75, features 0 (= missing dots), hair 0.28, lit rim 0.55,
     highlights 1.0 (the shader forces them to full-size dots).
     The head is tilted 4 degrees toward the desktop (rotate about the neck).
     Light from the viewer's left. Groups are baked separately by gen_figure.py. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="iris" x1="0" y1="-24" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.5" stop-color="#737373"/>
      <stop offset="1" stop-color="#737373"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#525252"/>
      <stop offset="1" stop-color="#363636"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <!-- eye white of the viewer-right eye, outer corner at +x, centred on 0,0 -->
    <path id="scleraShape" d="M -38,8 C -37,-24 28,-36 40,-6 C 39,14 30,28 2,30 C -24,30 -37,23 -38,8 Z"/>
    <clipPath id="scleraClip"><use xlink:href="#scleraShape"/></clipPath>
    <g id="eyeOpen">
      <use xlink:href="#scleraShape" fill="#d9d9d9"/>
      <g clip-path="url(#scleraClip)">
        <!-- iris shifted to the inner corner so a white wedge shows on the outer side -->
        <ellipse cx="-9" cy="6" rx="22" ry="30" fill="url(#iris)" stroke="#333333" stroke-width="4"/>
        <path d="M -28,18 C -22,36 4,36 10,18 C 4,28 -22,28 -28,18 Z" fill="#999999"/>
        <ellipse cx="-9" cy="4" rx="6" ry="9" fill="#000000"/>
      </g>
      <!-- upper lid: the only near-black band (~2 dots), dips at the outer corner, one flick -->
      <path fill="#000000" d="M -42,12 C -41,-29 30,-41 44,-9 L 54,-14 L 46,0
        C 44,2 42,2 40,0 C 33,-14 4,-31 -34,-9 C -38,-2 -40,5 -42,12 Z"/>
      <path d="M 14,31 C 26,29 34,23 39,14" fill="none" stroke="#4d4d4d" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="eyeClosed">
      <path d="M -28,0 C -14,15 14,15 28,0" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
      <path d="M 25,2 L 37,-6" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path id="brow" d="M 264,284 C 246,276 218,280 200,295 C 220,290 246,292 262,295 Z"/>
    <path id="blush" d="M 382,394 L 388,384 M 392,395 L 398,385 M 402,394 L 408,384"/>
    <clipPath id="faceClip"><path d="M 184,300 C 184,250 230,222 300,222 C 370,222 416,250 416,300
      L 416,356 C 416,408 382,444 334,466 C 322,472 312,478 300,478 C 288,478 278,472 266,466
      C 218,444 184,408 184,356 Z"/></clipPath>
    <clipPath id="neckClip"><path d="M 266,430 L 266,560 L 334,560 L 334,430 Z"/></clipPath>
  </defs>

  <g id="hair-back" transform="rotate(-4 300 470)">
    <path fill="#474747" d="M 310,68 C 196,70 146,156 140,260 C 136,360 134,460 128,560
      C 124,600 116,630 106,660 L 192,640 L 408,640 L 494,660 C 484,630 476,600 472,560
      C 466,460 464,360 460,260 C 454,156 410,68 310,68 Z"/>
  </g>

  <g id="neck">
    <path fill="#8c8c8c" d="M 266,430 L 266,560 L 334,560 L 334,430 Z"/>
    <path fill="#333333" filter="url(#soft2)" clip-path="url(#neckClip)"
          d="M 258,450 C 280,478 320,478 342,450 L 342,484 C 320,496 280,496 258,484 Z"/>
  </g>


  <g id="body" transform="translate(0,-16)">
    <path fill="url(#hoodie)" d="M 30,830 C 40,690 110,622 212,592 C 242,582 258,562 265,540
      L 335,540 C 342,562 358,582 388,592 C 490,622 560,690 570,830 Z"/>
    <path fill="none" stroke="#737373" stroke-width="10" stroke-linecap="round"
          d="M 36,816 C 48,690 114,626 210,596"/>
    <path fill="none" stroke="#474747" stroke-width="8" stroke-linecap="round"
          d="M 390,596 C 486,626 552,690 564,816"/>
    <path fill="none" stroke="#1e1e1e" stroke-width="10" stroke-linecap="round" d="M 300,640 L 300,830"/>
    <path fill="#5e5e5e" d="M 198,600 C 210,548 254,518 300,528 C 346,518 390,548 402,600
      C 372,628 334,610 300,622 C 266,610 228,628 198,600 Z"/>
    <path fill="none" stroke="#999999" stroke-width="10" stroke-linecap="round"
          d="M 204,594 C 216,554 254,526 296,532"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 280,620 C 278,652 274,684 272,714 M 320,620 C 324,652 328,686 330,718"/>
    <rect x="265" y="712" width="14" height="22" rx="5" fill="#a0a0a0"/>
    <rect x="323" y="716" width="14" height="22" rx="5" fill="#a0a0a0"/>
  </g>

  <g id="hair-curtain" transform="rotate(-4 300 470)">
    <!-- long hair over the shoulders, behind the face; 3 tapered tips each side at chest height -->
    <path fill="#474747" d="M 156,260 C 150,360 150,460 148,540 C 146,600 132,650 112,696
      C 128,692 140,684 148,672 C 150,690 148,708 142,728 C 160,712 170,694 176,672
      C 182,694 184,714 180,736 C 198,708 206,676 208,640 C 210,590 212,540 214,470
      C 216,400 214,330 210,262 Z"/>
    <path fill="#474747" d="M 444,260 C 450,360 450,460 452,540 C 454,600 468,650 488,696
      C 472,692 460,684 452,672 C 450,690 452,708 458,728 C 440,712 430,694 424,672
      C 418,694 416,714 420,736 C 402,708 394,676 392,640 C 390,590 388,540 386,470
      C 384,400 386,330 390,262 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 154,300 C 150,400 150,500 146,566 C 142,616 130,656 116,690"/>
    <path fill="none" stroke="#666666" stroke-width="8" stroke-linecap="round"
          d="M 184,330 C 184,430 184,530 182,620 M 416,330 C 416,430 416,530 418,620"/>
  </g>

  <g id="face" transform="rotate(-4 300 470)">
    <!-- ear (viewer-right): that sidelock is tucked behind it -->
    <path fill="#d4d4d4" d="M 410,318 C 428,312 438,330 436,348 C 434,366 424,378 410,376 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="5" stroke-linecap="round" d="M 418,330 C 428,334 428,352 420,362"/>
    <path fill="#ebebeb" d="M 184,300 C 184,250 230,222 300,222 C 370,222 416,250 416,300
      L 416,356 C 416,408 382,444 334,466 C 322,472 312,478 300,478 C 288,478 278,472 266,466
      C 218,444 184,408 184,356 Z"/>
    <!-- soft cheek shade + soft fringe shadow -->
    <g clip-path="url(#faceClip)">
      <ellipse cx="208" cy="408" rx="26" ry="34" fill="#bfbfbf" filter="url(#soft)"/>
      <ellipse cx="392" cy="408" rx="26" ry="34" fill="#bfbfbf" filter="url(#soft)"/>
    </g>
    <path fill="#9a9a9a" filter="url(#soft)" clip-path="url(#faceClip)" d="M 184,240 L 416,240 L 416,300 C 380,292 340,304 300,300
      C 260,304 220,292 184,300 Z"/>
    <use xlink:href="#brow" fill="#383838"/>
    <use xlink:href="#brow" fill="#383838" transform="translate(600,0) scale(-1,1)"/>
    <!-- blush: three short diagonal runs of MISSING dots under each eye's outer corner -->
    <use xlink:href="#blush" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <use xlink:href="#blush" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"
         transform="translate(600,0) scale(-1,1)"/>
    <!-- nose: two missing dots -->
    <path d="M 304,399 L 302,406" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- mouth: small ‿ with raised corners, open centre wedge, a tongue dot -->
    <path d="M 290,441 Q 300,451 310,441" fill="none" stroke="#262626" stroke-width="4" stroke-linecap="round"/>
    <path d="M 295,446 L 305,446 L 300,452 Z" fill="#262626"/>
    <circle cx="300" cy="454" r="2.6" fill="#808080"/>
  </g>

  <g id="eyes-open" transform="rotate(-4 300 470)">
    <use xlink:href="#eyeOpen" transform="translate(368,338)"/>
    <use xlink:href="#eyeOpen" transform="translate(232,338) scale(-1,1)"/>
    <!-- two highlights per eye, same light direction (upper-left), inside the iris -->
    <ellipse cx="232" cy="333" rx="6.5" ry="7.5" fill="#ffffff"/>
    <ellipse cx="350" cy="333" rx="6.5" ry="7.5" fill="#ffffff"/>
    <circle cx="250" cy="356" r="4" fill="#ffffff"/>
    <circle cx="368" cy="356" r="4" fill="#ffffff"/>
  </g>

  <g id="eyes-closed" display="none" transform="rotate(-4 300 470)">
    <use xlink:href="#eyeClosed" transform="translate(368,344)"/>
    <use xlink:href="#eyeClosed" transform="translate(232,344) scale(-1,1)"/>
  </g>

  <g id="hair-side" transform="rotate(-4 300 470)">
    <!-- viewer-left sidelock in front of the face, ending in a small flyaway curl -->
    <path fill="#4a4a4a" d="M 162,236 C 150,300 152,392 172,470 C 166,484 170,494 182,494
      C 176,488 176,480 184,474 C 192,430 196,392 198,350 C 200,316 204,284 214,256 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 160,250 C 152,310 156,390 172,462"/>
  </g>

  <g id="bangs" transform="rotate(-4 300 470)">
    <!-- rounder, taller crown peaking toward the ahoge; 5 uneven clumps, part off-centre
         to her right (viewer-left), centre clump shortest so the forehead shows -->
    <path fill="#474747" d="M 166,282 C 152,150 222,68 310,68 C 392,70 448,150 434,282
      C 430,298 424,312 414,322 C 410,310 400,302 382,298
      C 374,302 364,306 350,306 C 346,298 336,292 320,288
      C 314,290 304,294 292,296 C 284,286 268,278 250,272
      C 248,288 242,298 230,306 C 226,302 218,300 206,300
      C 200,306 192,314 182,318 C 178,304 174,292 166,282 Z"/>
    <!-- interior strand lines -->
    <path fill="none" stroke="#666666" stroke-width="8" stroke-linecap="round"
          d="M 252,112 C 248,170 248,220 250,262 M 210,168 C 202,210 202,256 206,282
             M 324,114 C 334,170 334,230 322,276 M 384,150 C 396,200 396,250 382,282"/>
    <!-- glossy highlight: dashed arcs following the skull -->
    <path fill="none" stroke="#8c8c8c" stroke-width="9" stroke-linecap="round" stroke-dasharray="30 14"
          d="M 196,176 C 230,128 268,112 310,112 C 352,112 390,132 418,180"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 12"
          d="M 226,200 C 252,170 280,160 310,160 C 340,160 366,170 388,196"/>
    <!-- lit rim (left) and a softer right rim -->
    <path fill="none" stroke="#8c8c8c" stroke-width="10" stroke-linecap="round"
          d="M 168,270 C 158,170 220,78 304,72"/>
    <path fill="none" stroke="#666666" stroke-width="8" stroke-linecap="round"
          d="M 432,270 C 442,170 388,78 316,72"/>
  </g>

  <g id="ahoge" transform="rotate(-4 300 470)">
    <path fill="#474747" d="M 306,74 C 310,48 328,30 348,34 C 362,38 356,58 336,58
      C 348,50 346,42 338,44 C 324,46 316,60 318,74 Z"/>
    <path fill="none" stroke="#8c8c8c" stroke-width="8" stroke-linecap="round"
          d="M 310,66 C 314,50 328,38 344,38"/>
  </g>

  <g id="clip" transform="rotate(-4 300 470)">
    <!-- hair clip bar; the red bead at its end is drawn by the shader (clipUV) -->
    <path d="M 194,236 L 238,214" stroke="#a6a6a6" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
